# Fly.io configuration for AEGIS AI Quant Engine
# https://fly.io/docs/reference/configuration/

app = "aegis-jn6oxq"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  AEGIS_MODE = "paper"
  AEGIS_FOCUSED_MODE = "true"
  AEGIS_FOCUSED_SYMBOLS = "PAXGUSDT,BTCUSDT,ETHUSDT"
  AEGIS_MAX_POSITIONS = "3"
  AEGIS_INITIAL_CAPITAL = "20"
  AEGIS_ICT_CAPITAL = "50"
  AEGIS_CCXT_TESTNET = "true"
  AEGIS_ENGINE_ENABLED = "true"
  SUPABASE_URL = "https://xthknzlxseghdscpzssm.supabase.co"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
