[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/exchange.py",
    "app/routers/*",
    "app/scheduler.py",
    "app/supervisor.py",
    "app/main.py",
    "app/test_*.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
